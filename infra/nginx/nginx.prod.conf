events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Client body size limit for large biomedical dataset/document uploads
    client_max_body_size 100M;

    upstream roms_web {
        server web:80;
    }

    upstream roms_api {
        server api:4000;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # ROMS Web Frontend
        location / {
            proxy_pass http://roms_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ROMS Express API Gateway
        location /api/ {
            proxy_pass http://roms_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # GraphQL Subscriptions & Endpoint
        location /graphql {
            proxy_pass http://roms_api/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # API Health Monitoring
        location /healthz {
            proxy_pass http://roms_api/healthz;
        }

        # MinIO Object Storage Proxy
        location /storage/ {
            proxy_pass http://minio_s3/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
