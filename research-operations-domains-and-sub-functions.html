<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domains of Research Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#ffffff;
  --color-surface-offset:#f0eeea;--color-border:#d8d5ce;--color-divider:#e2dfd9;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;
  --color-primary-highlight:#d0dedd;--color-primary-soft:#e8f2f1;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --radius-sm:0.3rem;--radius-md:0.45rem;--radius-lg:0.65rem;
  --font-body:'Inter',sans-serif;--font-display:'Inter',system-ui,sans-serif;
  --fs-xs:0.6rem;--fs-sm:0.68rem;--fs-base:0.72rem;--fs-md:0.82rem;--fs-lg:1rem;--fs-xl:1.1rem;
}
[data-theme="dark"]{
  --color-bg:#141312;--color-surface:#1a1917;--color-surface-2:#1f1e1c;
  --color-surface-offset:#1d1c1a;--color-border:#333230;--color-divider:#252422;
  --color-text:#cccbc9;--color-text-muted:#767573;--color-text-faint:#555452;
  --color-primary:#4f98a3;--color-primary-hover:#3a8590;
  --color-primary-highlight:#253535;--color-primary-soft:#1e2e2e;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.25);--shadow-md:0 4px 12px rgba(0,0,0,0.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:var(--font-body);font-size:var(--fs-base);color:var(--color-text);background:var(--color-bg);display:flex;flex-direction:column;height:100vh;overflow:hidden}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}

/* TOP BAR */
.topbar{
  height:40px;min-height:40px;background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  flex-shrink:0;
}
.topbar-logo{display:flex;align-items:center;gap:7px}
.topbar-title{font-family:var(--font-display);font-size:var(--fs-md);color:var(--color-text);white-space:nowrap}
.topbar-sub{font-size:var(--fs-xs);color:var(--color-text-muted);margin-left:2px}
.topbar-spacer{flex:1}
.theme-btn{
  width:26px;height:26px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);
  transition:background 0.15s,color 0.15s;
}
.theme-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}

/* 3-COLUMN LAYOUT */
.workspace{display:flex;flex:1;overflow:hidden;height:calc(100vh - 40px)}

/* COL 1 — Domains (1/5) */
.col-domains{
  width:20%;min-width:140px;
  background:var(--color-surface);
  border-right:1px solid var(--color-border);
  display:flex;flex-direction:column;overflow:hidden;
}
.col-header{
  padding:8px 10px 6px;font-size:var(--fs-xs);font-weight:700;
  letter-spacing:0.09em;text-transform:uppercase;color:var(--color-text-faint);
  border-bottom:1px solid var(--color-divider);flex-shrink:0;
}
.domain-list{flex:1;overflow-y:auto;padding:4px 0}
.domain-list::-webkit-scrollbar{width:3px}
.domain-list::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
.domain-btn{
  width:100%;display:flex;align-items:center;gap:7px;
  padding:6px 10px;cursor:pointer;
  transition:background 0.14s;position:relative;text-align:left;
}
.domain-btn:hover{background:var(--color-surface-offset)}
.domain-btn.active{background:var(--color-primary-highlight)}
.domain-btn.active::before{
  content:'';position:absolute;left:0;top:3px;bottom:3px;
  width:2.5px;background:var(--color-primary);border-radius:0 2px 2px 0;
}
.d-num{font-size:var(--fs-xs);color:var(--color-text-faint);width:14px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.domain-btn.active .d-num{color:var(--color-primary);opacity:0.7}
.d-icon{font-size:0.78rem;flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:var(--color-surface-offset);border-radius:var(--radius-sm)}
.domain-btn.active .d-icon{background:color-mix(in srgb,var(--color-primary) 15%,var(--color-surface))}
.d-name{font-size:var(--fs-sm);line-height:1.3;color:var(--color-text);flex:1}
.domain-btn.active .d-name{color:var(--color-primary);font-weight:600}

/* COL 2 — Sub-Functions (1/5) */
.col-subfns{
  width:20%;min-width:140px;
  background:var(--color-surface-2);
  border-right:1px solid var(--color-border);
  display:flex;flex-direction:column;overflow:hidden;
}
.subfn-list{flex:1;overflow-y:auto;padding:4px 0}
.subfn-list::-webkit-scrollbar{width:3px}
.subfn-list::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
.subfn-btn{
  width:100%;display:flex;align-items:flex-start;gap:7px;
  padding:7px 10px;cursor:pointer;
  transition:background 0.14s;position:relative;text-align:left;
}
.subfn-btn:hover{background:var(--color-surface-offset)}
.subfn-btn.active{background:var(--color-primary-soft)}
.subfn-btn.active::before{
  content:'';position:absolute;left:0;top:4px;bottom:4px;
  width:2px;background:var(--color-primary);border-radius:0 2px 2px 0;
}
.sf-num{font-size:var(--fs-xs);color:var(--color-text-faint);flex-shrink:0;margin-top:1px;width:16px;text-align:right;font-variant-numeric:tabular-nums}
.subfn-btn.active .sf-num{color:var(--color-primary);opacity:0.7}
.sf-label{font-size:var(--fs-sm);line-height:1.35;color:var(--color-text);flex:1}
.subfn-btn.active .sf-label{color:var(--color-primary);font-weight:600}
.subfn-empty{padding:20px 12px;font-size:var(--fs-sm);color:var(--color-text-faint);font-style:italic}

/* COL 3 — Tasks (3/5) */
.col-tasks{
  flex:1;background:var(--color-bg);
  display:flex;flex-direction:column;overflow:hidden;
}
.tasks-header{
  padding:10px 16px 8px;border-bottom:1px solid var(--color-divider);
  flex-shrink:0;
}
.tasks-breadcrumb{font-size:var(--fs-xs);color:var(--color-text-faint);margin-bottom:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.bc-sep{opacity:0.5}
.bc-domain{color:var(--color-primary);font-weight:600}
.bc-sf{color:var(--color-text-muted)}
.tasks-title{font-family:var(--font-display);font-size:var(--fs-xl);color:var(--color-text);line-height:1.2}
.tasks-tagline{font-size:var(--fs-sm);color:var(--color-text-muted);font-style:italic;margin-top:3px}
.tasks-body{flex:1;overflow-y:auto;padding:14px 16px}
.tasks-body::-webkit-scrollbar{width:4px}
.tasks-body::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
.task-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 12px;margin-bottom:6px;
  background:var(--color-surface-2);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  transition:box-shadow 0.14s,background 0.14s;
}
.task-item:hover{background:var(--color-surface);box-shadow:var(--shadow-sm)}
.task-dot{width:6px;height:6px;border-radius:50%;background:var(--color-primary);flex-shrink:0;margin-top:5px;opacity:0.65}
.task-text{font-size:var(--fs-base);line-height:1.55;color:var(--color-text)}
.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;text-align:center;padding:32px;
}
.placeholder-icon{font-size:1.8rem;opacity:0.3;margin-bottom:10px}
.placeholder-title{font-family:var(--font-display);font-size:var(--fs-lg);color:var(--color-text-muted);margin-bottom:6px}
.placeholder-sub{font-size:var(--fs-sm);color:var(--color-text-faint);max-width:36ch;line-height:1.6}
.anim{animation:fadeUp 0.2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-logo">
    <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
      <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
      <rect x="7" y="8" width="6" height="6" rx="1.5" fill="white" opacity="0.9"/>
      <rect x="15" y="8" width="10" height="6" rx="1.5" fill="white" opacity="0.55"/>
      <rect x="7" y="16" width="10" height="6" rx="1.5" fill="white" opacity="0.55"/>
      <rect x="19" y="16" width="6" height="6" rx="1.5" fill="white" opacity="0.9"/>
    </svg>
    <span class="topbar-title">Research Operations</span>
    <span class="topbar-sub">— 10 Domain Map</span>
  </div>
  <div class="topbar-spacer"></div>
  <button class="theme-btn" data-theme-toggle aria-label="Toggle theme">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>

<div class="workspace">

  <!-- COL 1: DOMAINS -->
  <aside class="col-domains">
    <div class="col-header">Domains</div>
    <nav class="domain-list" id="domainList"></nav>
  </aside>

  <!-- COL 2: SUB-FUNCTIONS -->
  <aside class="col-subfns">
    <div class="col-header">Sub-Functions</div>
    <nav class="subfn-list" id="subfnList">
      <div class="subfn-empty">Select a domain to view its sub-functions.</div>
    </nav>
  </aside>

  <!-- COL 3: TASKS -->
  <main class="col-tasks">
    <div class="tasks-header" id="tasksHeader" style="display:none">
      <div class="tasks-breadcrumb" id="tasksBreadcrumb"></div>
      <div class="tasks-title" id="tasksTitle"></div>
      <div class="tasks-tagline" id="tasksTagline"></div>
    </div>
    <div class="tasks-body" id="tasksBody">
      <div class="placeholder">
        <div class="placeholder-icon">🔬</div>
        <div class="placeholder-title">Research Operations</div>
        <div class="placeholder-sub">Select a domain, then a sub-function to explore its operational tasks.</div>
      </div>
    </div>
  </main>

</div>

<script>

        "Label aliquots with barcoded identifiers and record processing timestamps",
        "Log any deviations from standard processing procedures"

      { name:"Cryopreservation & Cold-Chain", tasks:[
        "Assign samples to appropriate storage temperature (−80°C, −196°C LN₂, +4°C)",

      { name:"Retrieval & Dispensing", tasks:[

  {

      { name:"Equipment & Instruments", tasks:[

  {

        "Prepare for external audits by regulatory bodies, funders, and accreditors"
      ]},
      { name:"Incident & Deviation Reporting", tasks:[
        "Log non-conformances, deviations, and near-miss events",

// State
let activeDomain = null;
let activeSubfn = null;

// Build domain list
const domainList = document.getElementById('domainList');
domains.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'domain-btn';
  btn.dataset.id = d.id;
  btn.innerHTML = `<span class="d-num">${d.id}</span><span class="d-icon">${d.emoji}</span><span class="d-name">${d.name}</span>`;
  btn.addEventListener('click', () => selectDomain(d.id));
  domainList.appendChild(btn);
});

function selectDomain(id) {
  activeDomain = domains.find(x => x.id === id);
  activeSubfn = null;

  document.querySelectorAll('.domain-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.id) === id));

  // Render sub-functions
  const sfList = document.getElementById('subfnList');
  sfList.innerHTML = '';
  activeDomain.subfunctions.forEach((sf, i) => {
    const btn = document.createElement('button');
    btn.className = 'subfn-btn';
    btn.dataset.idx = i;
    btn.innerHTML = `<span class="sf-num">${i+1}</span><span class="sf-label">${sf.name}</span>`;
    btn.addEventListener('click', () => selectSubfn(i));
    sfList.appendChild(btn);
  });

  // Clear tasks panel
  document.getElementById('tasksHeader').style.display = 'none';
  document.getElementById('tasksBody').innerHTML = `<div class="placeholder"><div class="placeholder-icon">${activeDomain.emoji}</div><div class="placeholder-title">${activeDomain.name}</div><div class="placeholder-sub">Select a sub-function to explore its operational tasks.</div></div>`;
}

function selectSubfn(idx) {
  if(!activeDomain) return;
  activeSubfn = activeDomain.subfunctions[idx];

  document.querySelectorAll('.subfn-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.idx) === idx));

  // Header
  const hdr = document.getElementById('tasksHeader');
  hdr.style.display = 'block';
  document.getElementById('tasksBreadcrumb').innerHTML =
    `<span class="bc-domain">${activeDomain.emoji} ${activeDomain.name}</span><span class="bc-sep">›</span><span class="bc-sf">${activeSubfn.name}</span>`;
  document.getElementById('tasksTitle').textContent = activeSubfn.name;
  document.getElementById('tasksTagline').textContent = `${activeSubfn.tasks.length} operational tasks`;

  // Tasks
  const body = document.getElementById('tasksBody');
  body.innerHTML = activeSubfn.tasks.map(t => `
    <div class="task-item anim">
      <span class="task-dot"></span>
      <span class="task-text">${t}</span>
    </div>
  `).join('');
}

// Theme toggle
(function(){
  const btn = document.querySelector('[data-theme-toggle]');
  const root = document.documentElement;
  let dark = matchMedia('(prefers-color-scheme:dark)').matches;
  root.setAttribute('data-theme', dark?'dark':'light');
  function updateIcon(){
    btn.innerHTML = dark
      ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  updateIcon();
  btn.addEventListener('click',()=>{dark=!dark;root.setAttribute('data-theme',dark?'dark':'light');updateIcon();});
})();
</script>
